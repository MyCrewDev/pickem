<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>Pick'em · Rob v Marcus</title>
<style>
  :root{
    --bg:#07101f; --card:#0f243f; --card2:#0c1d34; --line:#1d3a5c;
    --gold:#c8a24b; --goldlt:#e6c878; --txt:#eaf1fb; --mut:#8ba6c6; --dim:#5f7a9a;
    --up:#7ee0a3; --down:#ff8a8a; --live:#ff5a5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);background-color:var(--bg);
    background-image:
      linear-gradient(180deg, rgba(7,16,31,.66) 0%, rgba(7,16,31,.86) 42%, rgba(7,16,31,.95) 100%),
      url('bg.jpg');
    background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;
    min-height:100vh;}
  button{font:inherit}
  a{color:inherit}

  /* ---------- top bar + tabs ---------- */
  .top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 0;
    background:linear-gradient(180deg,rgba(7,16,31,.97) 0%,rgba(7,16,31,.92) 80%,rgba(7,16,31,0) 100%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .topin{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;font-size:12px;color:var(--gold)}
  .brand svg{width:18px;height:18px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:10px 0 0;border-bottom:1px solid var(--line)}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 10px;
    text-decoration:none;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.02em}
  .tab svg{width:20px;height:20px;opacity:.8}
  .tab.on{color:var(--goldlt)}
  .tab.on svg{opacity:1}
  .tab.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold),var(--goldlt))}
  .tab .ping{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--live);
    box-shadow:0 0 0 0 rgba(255,90,94,.7);animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,90,94,.6)}80%,100%{box-shadow:0 0 0 7px rgba(255,90,94,0)}}

  .wrap{max-width:560px;margin:0 auto;padding:10px 16px 140px}
  .loading{text-align:center;color:var(--mut);padding:60px 0}
  .note{text-align:center;color:var(--mut);font-size:14px;line-height:1.45}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;text-align:center}
  h1.title{margin:6px 0 2px;text-align:center;font-size:22px;line-height:1.2}
  .sub{color:var(--mut);font-size:13px;text-align:center;margin-top:3px}
  .sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:22px 2px 8px}

  .panel{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px}

  /* ---------- game strip (two fixtures) ---------- */
  .games{display:grid;gap:8px;margin:14px 0 4px}
  .game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;
    background:linear-gradient(180deg,rgba(15,36,63,.94),rgba(12,29,52,.94));border:1px solid var(--line)}
  .side{display:flex;align-items:center;gap:9px;min-width:0}
  .side.r{justify-content:flex-end;text-align:right}
  .crest{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:11px;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .tn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid{text-align:center;min-width:64px}
  .score{font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--txt);line-height:1}
  .ko{font-size:13px;font-weight:800;color:var(--goldlt)}
  .gstate{font-size:11px;color:var(--mut);margin-top:3px;font-weight:700;letter-spacing:.04em}
  .gstate.live{color:var(--live)}
  .gstate.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:ping 1.6s infinite}
  .venue{grid-column:1/-1;text-align:center;font-size:11px;color:var(--dim);margin-top:-2px}

  /* ---------- picker ---------- */
  .who{margin:16px 0 4px}
  .who .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800;text-align:center}
  .chips{display:flex;gap:8px;margin:9px 0 2px}
  .chip{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:#0a1c33;color:var(--txt);
    font-weight:700;font-size:15px;cursor:pointer;position:relative}
  .chip.on{background:linear-gradient(135deg,var(--gold),var(--goldlt));color:#1a1205;border-color:var(--goldlt)}
  .chip small{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:2px}
  .chip.on small{color:#4a3a12}
  .glabel{display:flex;align-items:center;gap:8px;margin:20px 2px 2px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800}
  .glabel .dot{width:8px;height:8px;border-radius:50%}
  .glabel::after{content:"";flex:1;height:1px;background:var(--line)}
  .bet{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:16px;padding:14px 14px 13px;margin:10px 0;transition:border-color .2s}
  .bet.done{border-color:var(--gold)}
  .bhead{display:flex;align-items:flex-start;gap:11px}
  .num{flex:none;width:26px;height:26px;border-radius:50%;background:#0a1c33;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--gold);margin-top:-1px}
  .bhead h3{margin:0;font-size:16px;font-weight:700;line-height:1.25}
  .blurb{margin:7px 0 0 37px;color:var(--mut);font-size:13px;line-height:1.4}
  .opts{display:flex;gap:9px;margin-top:12px}
  .opt{flex:1;padding:13px 8px;border-radius:12px;border:1.5px solid var(--line);background:#0a1c33;
    color:var(--txt);font-weight:700;font-size:15px;cursor:pointer;transition:all .15s}
  .opt:active{transform:scale(.98)}
  .opt.on{background:linear-gradient(135deg,var(--gold),var(--goldlt));color:#1a1205;border-color:var(--goldlt);
    box-shadow:0 6px 16px rgba(200,162,75,.25)}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(7,16,31,0),#07101f 38%);}
  .barin{max-width:560px;margin:0 auto}
  .prog{text-align:center;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:800;text-align:center;
    background:linear-gradient(135deg,var(--gold),var(--goldlt));color:#1a1205;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:15px}
  .err{color:var(--down);text-align:center;font-size:14px;margin-top:6px;min-height:18px}
  .lock{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--mut);margin-top:8px}
  .lock b{color:var(--goldlt)}
  .status{display:flex;gap:8px;margin-top:10px}
  .status div{flex:1;text-align:center;font-size:13px;color:var(--mut);padding:9px 6px;border-radius:11px;border:1px dashed var(--line)}
  .status div.in{color:var(--up);border-style:solid;border-color:rgba(126,224,163,.35)}

  .done-screen{text-align:center;padding:26px 6px 10px}
  .done-screen svg.big{width:64px;height:64px}
  .done-screen h2{margin:10px 0 6px}
  .summary{text-align:left;margin:16px auto 0;max-width:440px}
  .srow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .srow span{color:var(--mut)}
  .srow b{color:var(--goldlt);text-align:right;flex:none}

  /* ---------- account / balance ---------- */
  .account{background:linear-gradient(180deg,rgba(15,36,63,.94),rgba(12,29,52,.94));border:1px solid var(--gold);border-radius:16px;padding:16px;text-align:center;margin-top:14px}
  .account .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800}
  .account .fig{font-size:30px;font-weight:800;color:var(--goldlt);margin:6px 0 2px;line-height:1.1}
  .account .fig.sm{font-size:24px}
  .account .s{font-size:13px;color:var(--mut)}
  .tug{position:relative;height:10px;border-radius:6px;background:#0a1c33;border:1px solid var(--line);margin:16px 0 7px}
  .tug .midl{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--mut);opacity:.6}
  .tug .fill{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,rgba(200,162,75,.2),rgba(230,200,120,.7))}
  .tug .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldlt));transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(200,162,75,.18),0 2px 8px rgba(0,0,0,.45);transition:left .8s cubic-bezier(.2,.8,.2,1)}
  .tugends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);font-weight:700}

  /* ---------- board table ---------- */
  .score2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .pl{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:center}
  .pl.lead{border-color:var(--gold);background:linear-gradient(135deg,#15294a,#0f243f)}
  .pl .n{font-size:12px;color:var(--mut);font-weight:700}
  .pl .v{font-size:22px;font-weight:800;color:var(--goldlt);margin-top:2px}
  .pl .v small{font-size:13px;color:var(--mut);font-weight:700}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;table-layout:fixed}
  .tbl th,.tbl td{padding:9px 5px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl th{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
  .tbl th.b,.tbl td.b{text-align:left;width:33%}
  .tbl td.b{color:#cdddf2;line-height:1.3}
  .tbl td.b i{font-style:normal;color:var(--gold);font-weight:800;margin-right:3px}
  .tbl td.b em{display:block;font-style:normal;color:var(--dim);font-size:11px;margin-top:2px}
  .tbl col.e{width:17%}
  .tbl th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:3px;padding-right:3px}
  .r{color:var(--up);font-weight:800}
  .w{color:var(--down)}
  .res{color:var(--goldlt);font-weight:800}
  .pend{color:var(--dim)}
  .eur{font-weight:800;font-size:12px;line-height:1.2}
  .eur.up{color:var(--up)} .eur.down{color:var(--down)} .eur.push{color:var(--dim);font-weight:600}
  .hidden-picks{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;margin:14px 0 4px}
  .refresh{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:11px;margin-top:12px}

  /* ---------- lists ---------- */
  .list{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;
    background:linear-gradient(180deg,rgba(15,36,63,.94),rgba(12,29,52,.94));border:1px solid var(--line);text-decoration:none}
  .row:active{transform:scale(.995)}
  .row .t{font-weight:700;font-size:15px}
  .row .m{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.35}
  .row .k{text-align:right;font-weight:800;font-size:15px;white-space:nowrap}
  .row .k small{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
  .row.ours{border-color:rgba(200,162,75,.55)}
  .day{font-size:12px;font-weight:800;color:var(--goldlt);margin:16px 2px 6px}
  .fx{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(29,58,92,.6)}
  .fx:last-child{border-bottom:none}
  .fx .tm{font-size:13px;font-weight:800;color:var(--txt)}
  .fx .tt{font-size:14px;display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
  .sw{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
  .fx .tt span.v{color:var(--dim);font-size:12px}
  .fx.star .tt{font-weight:700}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}

  /* ---------- season ---------- */
  .pills{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}
  .pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--mut);text-decoration:none;border:1px solid transparent}
  .pill.on{color:var(--goldlt);border-color:rgba(200,162,75,.5);background:rgba(200,162,75,.08)}
  .chart{margin-top:14px;padding:12px 10px 8px}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);font-weight:700;padding:0 4px;margin-top:4px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stat{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:center}
  .stat .n{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em}
  .stat .v{font-size:20px;font-weight:800;margin-top:3px}
  .stat .v small{font-size:12px;color:var(--mut);font-weight:700}
  .open-line{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:14px;border:1px dashed rgba(200,162,75,.45);color:var(--mut);font-size:13px}
  .open-line b{color:var(--goldlt);margin-left:auto;white-space:nowrap}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;text-decoration:none;margin:4px 0 6px;font-weight:700}
  .back svg{width:14px;height:14px}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2l3.3 2.4-1.2 3.9H9.9L8.7 9.6z"/><path d="M12 7.2V3.4M15.3 9.6l3.6-1.2M14.1 13.5l2.2 3.2M9.9 13.5l-2.2 3.2M8.7 9.6L5.1 8.4"/></svg>
    Pick'em · Rob v Marcus
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></div>

<div class="wrap" id="app"><div class="loading">Loading…</div></div>

<script>
const API = "https://ybwamkukfhwtwnekyyfk.supabase.co/functions/v1/pickem";
const ROB = "RobitityRob", MAR = "MeisterMarkus";
const params = new URLSearchParams(location.search);
const app = document.getElementById("app");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const api = async (q) => { const r = await fetch(API + q, { headers: { accept: "application/json" } }); return r.json(); };
const eur = (n) => "€" + Math.abs(n);

// ---------- icons (hand-drawn, soft strokes) ----------
const ICON = {
  tonight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/><path d="M16.5 3.8l.5 1.4 1.4.5-1.4.5-.5 1.4-.5-1.4-1.4-.5 1.4-.5z"/></svg>',
  upcoming: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M10.5 14.5l1.6 1.6 3-3.2"/></svg>',
  results: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5h9v4.2a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6.2H5.2a2.4 2.4 0 0 0 2.6 3.3M16.5 6.2h2.3a2.4 2.4 0 0 1-2.6 3.3"/><path d="M12 13.2v3.3M8.8 19.5c.4-1.8 1.6-3 3.2-3s2.8 1.2 3.2 3z"/></svg>',
  season: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5c2.5 0 3.2-5 5.6-5s2.6 2.5 4.6 2.5S17.5 7 20 5"/><path d="M4 4.5v15h16"/></svg>',
  trophy: '<svg class="big" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c878"/><stop offset="1" stop-color="#b08a35"/></linearGradient></defs><path d="M20 10h24v12c0 7-5.4 12.5-12 12.5S20 29 20 22z" fill="url(#tg)"/><path d="M20 14h-6c0 6 3 10 7.5 10.5M44 14h6c0 6-3 10-7.5 10.5" stroke="#c8a24b" stroke-width="3" stroke-linecap="round"/><path d="M32 34.5v8" stroke="#c8a24b" stroke-width="4" stroke-linecap="round"/><path d="M22 54c1-6 5-10 10-10s9 4 10 10z" fill="url(#tg)"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  eye: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6z"/><path d="M4 20L20 4"/></svg>',
  tick: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M5 12.5l4.2 4 9.8-10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></svg>',
};

// ---------- time helpers ----------
const tSpain = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });
const tUK = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });
const dLong = (iso) => new Date(iso).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Madrid" });
const dShort = (iso) => new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/Madrid" });
const dayKey = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "Europe/Madrid" });
const todayKey = dayKey(new Date().toISOString());
const lockOf = (card) => Math.min(...[card.match?.kickoff ?? card.kickoff, ...(card.games || []).map((g) => g.kickoff)].filter(Boolean).map((k) => new Date(k).getTime()));
const isLocked = (card) => Date.now() >= lockOf(card);
const isSettled = (card) => (card.match?.status ?? card.status) === "settled";

// ---------- crests ----------
function lum(hex){ const h = (hex || "#334").replace("#",""); const n = parseInt(h.length === 3 ? h.split("").map(c=>c+c).join("") : h, 16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return (0.299*r+0.587*g+0.114*b)/255; }
function crest(short, color){
  const c = color || "#1d3a5c"; const dark = lum(c) > 0.62;
  return `<div class="crest" style="background:linear-gradient(135deg,${c},${shade(c,-28)});color:${dark ? "#14161c" : "#fff"};border:1px solid ${shade(c,25)}">${esc(short)}</div>`;
}
function shade(hex, pct){ const h=(hex||"#333").replace("#",""); let n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  const f=(v)=>Math.max(0,Math.min(255,Math.round(v+(pct/100)*255))); return "#"+[f((n>>16)&255),f((n>>8)&255),f(n&255)].map(v=>v.toString(16).padStart(2,"0")).join(""); }

function gameRow(g, showVenue = true){
  let mid;
  if (g.state === "pre" || g.home_score == null) {
    mid = `<div class="ko">${tSpain(g.kickoff)}</div><div class="gstate">${tUK(g.kickoff)} UK</div>`;
  } else {
    const live = g.state === "in";
    mid = `<div class="score">${g.home_score} – ${g.away_score}</div><div class="gstate ${live ? "live" : ""}">${esc(live ? (g.clock || "Live") : (g.clock || "FT"))}</div>`;
  }
  return `<div class="game">
    <div class="side">${crest(g.home_short, g.home_color)}<div class="tn">${esc(g.home)}</div></div>
    <div class="mid">${mid}</div>
    <div class="side r"><div class="tn">${esc(g.away)}</div>${crest(g.away_short, g.away_color)}</div>
    ${showVenue && g.venue ? `<div class="venue">${esc(g.venue)}</div>` : ""}
  </div>`;
}

// ---------- money: one card's swing (positive = Rob up) ----------
function cardLedger(card, stake){
  const ent = card.entries || [];
  const r = ent.find((e) => e.player === ROB), m = ent.find((e) => e.player === MAR);
  const per = {}; let swing = 0, robWins = 0, marWins = 0, settled = 0;
  for (const b of card.bets) {
    if (!b.correct) { per[b.n] = "pending"; continue; }
    settled++;
    const rp = r?.picks?.[b.n], mp = m?.picks?.[b.n];
    if (rp === b.correct) robWins++;
    if (mp === b.correct) marWins++;
    if (rp && mp && rp !== mp) {
      if (rp === b.correct) { swing += stake; per[b.n] = "up"; } else { swing -= stake; per[b.n] = "down"; }
    } else per[b.n] = (rp && mp) ? "push" : "pending";
  }
  return { swing, per, robWins, marWins, settled, both: !!(r && m && r.picks && m.picks) };
}
const balText = (bal) => bal === 0 ? "All square" : (bal > 0 ? ROB : MAR) + " " + eur(bal) + " up";
function tug(bal){
  const pos = Math.max(4, Math.min(96, 50 + (bal / 60) * 46));
  const fillL = Math.min(50, pos), fillW = Math.abs(pos - 50);
  return `<div class="tug"><div class="fill" style="left:${fillL}%;width:${fillW}%"></div><div class="midl"></div><div class="dot" style="left:${pos}%"></div></div>
    <div class="tugends"><span>${MAR}</span><span>${ROB}</span></div>`;
}

// ---------- navigation ----------
let liveFlag = false;
function nav(active){
  const t = (id, label, href) => `<a class="tab ${active === id ? "on" : ""}" href="${href}">${ICON[id]}${label}${id === "tonight" && liveFlag ? '<span class="ping"></span>' : ""}</a>`;
  document.getElementById("tabs").innerHTML =
    t("tonight", "Tonight", "?") + t("upcoming", "Upcoming", "?tab=upcoming") + t("results", "Results", "?tab=results") + t("season", "Season", "?tab=season");
}

let timer = null;
function autoRefresh(fn, ms){ clearTimeout(timer); timer = setTimeout(fn, ms); }

// ---------- TONIGHT ----------
async function renderTonight(){
  nav("tonight");
  const { cards } = await api("?action=cards");
  const ours = (cards || []).filter((c) => c.season);
  // Today's card, else the next one coming up, else the latest one.
  const today = ours.find((c) => dayKey(c.kickoff) === todayKey);
  const next = ours.filter((c) => new Date(c.kickoff) > new Date()).sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff))[0];
  const pick = today || next;
  if (!pick) {
    const last = ours.filter((c) => c.status === "settled").at(-1);
    app.innerHTML = `<div class="eyebrow" style="margin-top:14px">Nothing on tonight</div>
      <h1 class="title">No bets set yet</h1>
      <p class="note" style="margin-top:10px">Next time there's a big Champions League night, the picks will appear here.</p>
      <div style="margin-top:18px"><a class="btn ghost" href="?tab=upcoming">See what's coming up</a></div>
      ${last ? `<div style="margin-top:8px"><a class="btn ghost" href="?match=${esc(last.slug)}">Last result: ${esc(last.title || last.slug)}</a></div>` : ""}`;
    return;
  }
  return renderCard(pick.slug, "tonight");
}

// ---------- a card: picker before lock, board after ----------
async function renderCard(slug, tab){
  nav(tab);
  const base = await api("?match=" + encodeURIComponent(slug));
  if (!base || !base.match) { app.innerHTML = '<p class="note">Night not found.</p>'; return; }
  if (!isLocked(base) && base.match.status === "open" && params.get("view") !== "board") return renderPicker(base, tab);
  return renderBoard(slug, tab);
}

function cardHeader(card, back){
  const m = card.match;
  return `${back ? `<a class="back" href="${back}">${ICON.back}Back</a>` : ""}
    <div class="eyebrow" style="margin-top:${back ? 0 : 12}px">${esc(m.competition)}</div>
    <h1 class="title">${esc(m.title || (m.home + " v " + m.away))}</h1>
    <div class="sub">${esc(dLong(m.kickoff))}</div>
    <div class="games">${card.games.map((g) => gameRow(g)).join("")}</div>`;
}

async function renderPicker(card, tab){
  const bets = card.bets, TOTAL = bets.length;
  const status = await api("?view=results&match=" + encodeURIComponent(card.match.slug)).catch(() => null);
  const inAlready = new Set((status?.entries || []).map((e) => e.player));
  const picks = {}; let name = "";
  const gameOf = (k) => card.games.find((g) => g.key === k);
  let lastKey = "~";
  const blocks = bets.map((b) => {
    let label = "";
    const key = b.game_key || "both";
    if (key !== lastKey) {
      lastKey = key;
      const g = gameOf(b.game_key);
      label = g ? `<div class="glabel"><span class="dot" style="background:${g.home_color}"></span>${esc(g.home)} v ${esc(g.away)}</div>`
                : `<div class="glabel"><span class="dot" style="background:var(--gold)"></span>Across both games</div>`;
    }
    return label + `<div class="bet" data-n="${b.n}">
      <div class="bhead"><span class="num">${b.n}</span><h3>${esc(b.title)}</h3></div>
      ${b.blurb ? `<p class="blurb">${esc(b.blurb)}</p>` : ""}
      <div class="opts">
        <button type="button" class="opt" data-n="${b.n}" data-c="A">${esc(b.opt_a)}</button>
        <button type="button" class="opt" data-n="${b.n}" data-c="B">${esc(b.opt_b)}</button>
      </div></div>`;
  }).join("");

  app.innerHTML = `<div id="form">
    ${cardHeader(card)}
    <div class="lock">${ICON.lock}Picks lock at kick-off, <b>${tSpain(lockOf(card))} Spain · ${tUK(lockOf(card))} UK</b></div>
    <div class="who panel">
      <div class="lbl">Who's picking?</div>
      <div class="chips">
        <button type="button" class="chip" data-name="${ROB}">${ROB}<small>${inAlready.has(ROB) ? "Picked · tap to change" : "Not picked yet"}</small></button>
        <button type="button" class="chip" data-name="${MAR}">${MAR}<small>${inAlready.has(MAR) ? "Picked · tap to change" : "Not picked yet"}</small></button>
      </div>
    </div>
    ${blocks}
    <div style="margin-top:18px"><a class="btn ghost" href="?match=${esc(card.match.slug)}&view=board${tab === "tonight" ? "" : "&tab=" + tab}">See the board</a></div>
  </div>
  <div id="done" class="done-screen" style="display:none">
    ${ICON.trophy}
    <h2>Picks locked in</h2>
    <p class="note" id="doneby"></p>
    <div class="summary" id="summary"></div>
    <p class="note" style="margin-top:16px">Your picks stay hidden from each other until kick-off.</p>
    <div style="margin-top:14px"><a class="btn ghost" href="?match=${esc(card.match.slug)}&view=board">See the board</a></div>
  </div>
  <div class="bar" id="bar"><div class="barin">
    <div class="prog" id="prog">0 of ${TOTAL} picked</div>
    <div class="err" id="err"></div>
    <button class="btn" id="submit" disabled>Lock in my picks</button>
  </div></div>`;

  const $ = (s) => document.querySelector(s);
  const refresh = () => {
    const c = Object.keys(picks).length;
    $("#prog").textContent = (name ? name + " · " : "Pick who you are · ") + c + " of " + TOTAL + " picked";
    $("#submit").disabled = !(c === TOTAL && name);
  };
  document.querySelectorAll(".opt").forEach((btn) => btn.addEventListener("click", () => {
    const n = btn.dataset.n, c = btn.dataset.c; picks[n] = c;
    const el = document.querySelector('.bet[data-n="' + n + '"]');
    el.querySelectorAll(".opt").forEach((o) => o.classList.toggle("on", o.dataset.c === c));
    el.classList.add("done"); refresh();
  }));
  document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on"); name = chip.dataset.name; refresh();
  }));
  $("#submit").addEventListener("click", async () => {
    const s = $("#submit"); s.disabled = true; $("#err").textContent = ""; s.textContent = "Saving…";
    try {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ match: card.match.slug, player: name, picks }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Something went wrong");
      $("#form").style.display = "none"; $("#bar").style.display = "none";
      $("#doneby").textContent = name + " · all " + TOTAL + " picks in";
      $("#summary").innerHTML = bets.map((b) => '<div class="srow"><span>' + b.n + '. ' + esc(b.title) + '</span><b>' + esc(picks[b.n] === "A" ? b.opt_a : b.opt_b) + '</b></div>').join("");
      $("#done").style.display = "block"; window.scrollTo(0, 0);
    } catch (e) { $("#err").textContent = e.message; s.disabled = false; s.textContent = "Lock in my picks"; }
  });
  refresh();
}

async function renderBoard(slug, tab){
  const card = await api("?view=results&match=" + encodeURIComponent(slug));
  if (!card || !card.match) { app.innerHTML = '<p class="note">Night not found.</p>'; return; }
  const seasonData = card.match.season ? await api("?view=season&season=" + encodeURIComponent(card.match.season)).catch(() => null) : null;
  const stake = seasonData?.season?.stake ?? 5;
  // Balance before this night = opening + every earlier night in the season.
  let before = seasonData?.season?.opening_balance ?? 0;
  for (const c of seasonData?.cards || []) {
    if (c.match.slug === slug) break;
    before += cardLedger(c, stake).swing;
  }
  const L = cardLedger(card, stake);
  const bal = before + L.swing;
  const live = card.games.some((g) => g.state === "in");
  const locked = isLocked(card);
  const hidden = (card.entries || []).some((e) => e.hidden);
  if (live !== liveFlag && tab === "tonight") { liveFlag = live; nav(tab); }

  const label = (b, c) => c === "A" ? b.opt_a : c === "B" ? b.opt_b : "—";
  const r = card.entries.find((e) => e.player === ROB), m = card.entries.find((e) => e.player === MAR);
  const settledAll = L.settled === card.bets.length;
  const gameOf = (k) => card.games.find((g) => g.key === k);

  const account = `<div class="account">
    <div class="lbl">${settledAll ? "Season account after this night" : "Season account · live"}</div>
    <div class="fig">${balText(bal)}</div>
    <div class="s">${L.both ? (L.swing === 0 ? "Level on the night" : (L.swing > 0 ? ROB : MAR) + " +" + eur(L.swing) + " on the night") + " · " + eur(stake) + " a bet" : "Starts moving once you've both picked and bets settle"}</div>
    ${tug(bal)}
  </div>`;

  let body;
  if (!card.entries.length) {
    body = `<p class="note" style="margin-top:16px">No picks in yet.${!locked ? ` <a href="?match=${esc(slug)}${tab === "tonight" ? "" : "&tab=" + tab}">Make yours</a>.` : ""}</p>`;
  } else if (hidden) {
    body = `<div class="status">
        <div class="${r ? "in" : ""}">${r ? ICON.tick + " " : ""}${ROB}<br>${r ? "picked" : "not yet"}</div>
        <div class="${m ? "in" : ""}">${m ? ICON.tick + " " : ""}${MAR}<br>${m ? "picked" : "not yet"}</div>
      </div>
      <div class="hidden-picks">${ICON.eye}Picks are revealed at kick-off, ${tSpain(lockOf(card))}</div>
      <div style="margin-top:10px"><a class="btn ghost" href="?match=${esc(slug)}${tab === "tonight" ? "" : "&tab=" + tab}">Make or change my picks</a></div>`;
  } else {
    const cols = [r ? ROB : null, m ? MAR : null].filter(Boolean);
    const short = (p) => p === ROB ? "Rob" : "Marcus";
    const scores = `<div class="score2">
      <div class="pl ${L.robWins > L.marWins ? "lead" : ""}"><div class="n">${ROB}</div><div class="v">${L.robWins}<small> / ${L.settled} right</small></div></div>
      <div class="pl ${L.marWins > L.robWins ? "lead" : ""}"><div class="n">${MAR}</div><div class="v">${L.marWins}<small> / ${L.settled} right</small></div></div>
    </div>`;
    const head = `<colgroup><col><col>${cols.length > 1 ? "<col>" : ""}<col><col class="e"></colgroup>
      <tr><th class="b">Bet</th>${cols.map((p) => `<th>${short(p)}</th>`).join("")}<th>Result</th><th>€</th></tr>`;
    const rows = card.bets.map((b) => {
      const g = gameOf(b.game_key);
      const cells = cols.map((p) => {
        const e = p === ROB ? r : m; const c = e?.picks?.[b.n];
        const cls = b.correct ? (c === b.correct ? "r" : "w") : "";
        return `<td class="${cls}">${esc(label(b, c))}</td>`;
      }).join("");
      const s = L.per[b.n];
      const e = s === "up" ? `<span class="eur up">${eur(stake)}<br>Rob</span>` : s === "down" ? `<span class="eur down">${eur(stake)}<br>Marcus</span>` : s === "push" ? `<span class="eur push">same<br>pick</span>` : `<span class="pend">·</span>`;
      return `<tr><td class="b"><i>${b.n}</i>${esc(b.title)}<em>${g ? esc(g.home + " v " + g.away) : "Both games"}</em></td>${cells}
        <td class="${b.correct ? "res" : "pend"}">${b.correct ? esc(label(b, b.correct)) : (locked ? "live" : "—")}</td><td>${e}</td></tr>`;
    }).join("");
    body = scores + `<div class="panel" style="margin-top:12px;padding:6px 10px 4px"><table class="tbl">${head}${rows}</table></div>`;
  }

  const back = tab === "results" ? "?tab=results" : (tab === "season" ? "?tab=season" : null);
  app.innerHTML = cardHeader(card, back) + account + body +
    (live || (locked && !settledAll) ? `<div class="refresh">${ICON.refresh}Updates itself every minute from the live feed</div>` : "") +
    (!locked && !hidden && card.entries.length === 0 ? "" : "");

  if (live || (locked && !settledAll)) autoRefresh(() => renderBoard(slug, tab), 60_000);
}

// ---------- UPCOMING ----------
async function renderUpcoming(){
  nav("upcoming");
  const [{ cards }, fx] = await Promise.all([api("?action=cards"), api("?action=fixtures").catch(() => ({ fixtures: [] }))]);
  const ours = (cards || []).filter((c) => c.season && !isLocked(c));
  const ourEvents = new Set((cards || []).flatMap((c) => (c.games || []).map((g) => (g.home + "|" + g.away).toLowerCase())));
  const mine = ours.length ? `<div class="sec">Our nights</div><div class="list">${ours.map((c) => `
      <a class="row ours" href="?match=${esc(c.slug)}&tab=upcoming">
        <div><div class="t">${esc(c.title)}</div><div class="m">${c.games.map((g) => esc(g.home + " v " + g.away)).join(" · ")}<br>${esc(dShort(c.kickoff))} · ${tSpain(c.kickoff)} Spain</div></div>
        <div class="k" style="color:var(--goldlt)">${c.bet_count} bets<small>${c.players.length === 2 ? "Both picked" : c.players.length ? "1 of 2 picked" : "Picks open"}</small></div>
      </a>`).join("")}</div>` : "";

  const byDay = {};
  for (const f of fx.fixtures || []) (byDay[dayKey(f.date)] ||= []).push(f);
  const days = Object.keys(byDay).sort();
  const fixtures = days.length ? days.map((d) => `
    <div class="day">${esc(dLong(byDay[d][0].date))}</div>
    <div class="panel" style="padding:2px 0">${byDay[d].sort((a, b) => a.date.localeCompare(b.date)).map((f) => {
      const star = ourEvents.has(((f.home === "Paris Saint-Germain" ? "PSG" : f.home) + "|" + f.away).toLowerCase());
      return `<div class="fx ${star ? "star" : ""}"><div class="tm">${tSpain(f.date)}</div>
        <div class="tt"><span class="sw" style="background:${f.home_color || "#456"}"></span>${esc(f.home)} <span class="v">v</span> <span class="sw" style="background:${f.away_color || "#456"}"></span>${esc(f.away)}${star ? ' <span class="tag">our bets</span>' : ""}</div></div>`;
    }).join("")}</div>`).join("") : `<p class="note">Couldn't reach the fixture list just now.</p>`;

  app.innerHTML = `<div class="eyebrow" style="margin-top:12px">Coming up</div>
    <h1 class="title">Upcoming games</h1>
    <div class="sub">Champions League, next 30 days · times in Spain</div>
    ${mine}
    <div class="sec">Champions League fixtures</div>
    ${fixtures}`;
}

// ---------- RESULTS ----------
async function renderResults(){
  nav("results");
  const all = [];
  const { seasons } = await api("?action=cards");
  for (const s of (seasons || []).slice().reverse()) {
    const sd = await api("?view=season&season=" + encodeURIComponent(s.slug));
    for (const c of (sd.cards || []).slice().reverse()) if (isLocked(c)) all.push({ c, s: sd.season });
  }
  const rows = all.map(({ c, s }) => {
    const L = cardLedger(c, s.stake);
    const sc = c.games.map((g) => esc(g.home + " " + (g.home_score ?? "–") + "–" + (g.away_score ?? "–") + " " + g.away)).join(" · ");
    const settled = isSettled(c) || L.settled === c.bets.length;
    const k = !L.both ? `<span style="color:var(--mut)">—</span>` : L.swing === 0 ? `<span style="color:var(--mut)">Level</span>`
      : `<span style="color:${L.swing > 0 ? "var(--up)" : "var(--down)"}">${L.swing > 0 ? "Rob" : "Marcus"} +${eur(L.swing)}</span>`;
    return `<a class="row" href="?match=${esc(c.match.slug)}&view=board&tab=results">
      <div><div class="t">${esc(c.match.title || c.match.slug)}</div><div class="m">${esc(dShort(c.match.kickoff))} · ${sc}<br>Bets right: Rob ${L.robWins} · Marcus ${L.marWins}${settled ? "" : " · still live"}</div></div>
      <div class="k">${k}<small>${esc(s.name.replace(" season", ""))}</small></div></a>`;
  }).join("");
  app.innerHTML = `<div class="eyebrow" style="margin-top:12px">Every night so far</div>
    <h1 class="title">Previous results</h1>
    <div class="sec">Newest first</div>
    <div class="list">${rows || '<p class="note">No results yet.</p>'}</div>`;
}

// ---------- SEASON ----------
async function renderSeason(){
  nav("season");
  const want = params.get("season");
  const sd = await api("?view=season" + (want ? "&season=" + encodeURIComponent(want) : ""));
  const s = sd.season, stake = s.stake;
  const nights = (sd.cards || []).filter((c) => isLocked(c));
  let bal = s.opening_balance;
  const points = [{ label: "Start", bal }];
  let robBets = 0, marBets = 0, robNights = 0, marNights = 0, best = null;
  for (const c of nights) {
    const L = cardLedger(c, stake);
    bal += L.swing; robBets += L.robWins; marBets += L.marWins;
    if (L.swing > 0) robNights++; else if (L.swing < 0) marNights++;
    if (!best || Math.abs(L.swing) > Math.abs(best.swing)) best = { swing: L.swing, title: c.match.title };
    points.push({ label: dShort(c.match.kickoff), bal, title: c.match.title, live: !(isSettled(c) || L.settled === c.bets.length) });
  }
  const pills = (sd.seasons || []).slice().reverse().map((x) => `<a class="pill ${x.slug === s.slug ? "on" : ""}" href="?tab=season&season=${esc(x.slug)}">${esc(x.name.replace(" season", ""))}</a>`).join("");
  const anyLive = points.some((p) => p.live);

  app.innerHTML = `<div class="eyebrow" style="margin-top:12px">The running account</div>
    <h1 class="title">${esc(s.name)}</h1>
    <div class="pills">${pills}</div>
    <div class="account">
      <div class="lbl">${anyLive ? "Balance · live" : "Balance now"}</div>
      <div class="fig">${balText(bal)}</div>
      <div class="s">${eur(stake)} a bet · only bets where you picked differently move money</div>
      ${tug(bal)}
    </div>
    <div class="panel chart">${chart(points)}</div>
    <div class="stats">
      <div class="stat"><div class="n">Bets right</div><div class="v">${robBets} <small>Rob</small> · ${marBets} <small>Marcus</small></div></div>
      <div class="stat"><div class="n">Nights won</div><div class="v">${robNights} <small>Rob</small> · ${marNights} <small>Marcus</small></div></div>
    </div>
    <div class="sec">How the season has gone</div>
    <div class="list">
      <div class="open-line">${s.opening_note ? esc(s.opening_note) : "Opening balance"}<b>${balText(s.opening_balance)}</b></div>
      ${nights.map((c) => {
        const L = cardLedger(c, stake);
        const k = !L.both ? "—" : L.swing === 0 ? "Level" : (L.swing > 0 ? "Rob +" : "Marcus +") + eur(L.swing);
        const col = L.swing > 0 ? "var(--up)" : L.swing < 0 ? "var(--down)" : "var(--mut)";
        return `<a class="row" href="?match=${esc(c.match.slug)}&view=board&tab=season"><div><div class="t">${esc(c.match.title)}</div>
          <div class="m">${esc(dShort(c.match.kickoff))} · ${c.games.map((g) => esc(g.home + " v " + g.away)).join(" · ")}</div></div>
          <div class="k" style="color:${col}">${k}<small>Rob ${L.robWins} · Marcus ${L.marWins}</small></div></a>`;
      }).join("") || '<p class="note">No nights played yet this season.</p>'}
    </div>`;
  if (anyLive) autoRefresh(renderSeason, 60_000);
}

// Balance chart: Rob up above the line, Marcus up below. Smooth curve, gold glow.
function chart(points){
  const W = 520, H = 210, P = { l: 8, r: 8, t: 22, b: 30 };
  const vals = points.map((p) => p.bal);
  const span = Math.max(20, ...vals.map((v) => Math.abs(v))) * 1.25;
  const x = (i) => P.l + (points.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (points.length - 1));
  const y = (v) => P.t + (H - P.t - P.b) / 2 - (v / span) * (H - P.t - P.b) / 2;
  const pts = points.map((p, i) => [x(i), y(p.bal)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  const zero = y(0);
  const area = d + ` L${pts.at(-1)[0]},${zero} L${pts[0][0]},${zero} Z`;
  const labels = points.map((p, i) => {
    const show = points.length <= 8 || i === 0 || i === points.length - 1 || i % Math.ceil(points.length / 6) === 0;
    return show ? `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === points.length - 1 ? "end" : "middle"}" fill="#8ba6c6" font-size="11" font-weight="700">${esc(p.label)}</text>` : "";
  }).join("");
  const dots = pts.map(([px, py], i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${px}" cy="${py}" r="${last ? 5.5 : 3.5}" fill="${last ? "#e6c878" : "#0f243f"}" stroke="#e6c878" stroke-width="2" ${last ? 'filter="url(#glow)"' : ""}/>` +
      (last ? `<text x="${px}" y="${py - 11}" text-anchor="end" fill="#e6c878" font-size="12" font-weight="800">${points[i].bal === 0 ? "Level" : (points[i].bal > 0 ? "Rob +" : "Marcus +") + eur(points[i].bal)}</text>` : "");
  }).join("");
  const len = 2000;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Season balance chart">
    <defs>
      <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c878" stop-opacity=".38"/><stop offset="1" stop-color="#e6c878" stop-opacity="0"/></linearGradient>
      <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b08a35"/><stop offset="1" stop-color="#f0d68e"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <text x="${P.l}" y="12" fill="#5f7a9a" font-size="10" font-weight="800" letter-spacing="1.2">ROB UP ↑</text>
    <text x="${P.l}" y="${H - P.b - 4}" fill="#5f7a9a" font-size="10" font-weight="800" letter-spacing="1.2">MARCUS UP ↓</text>
    <line x1="${P.l}" x2="${W - P.r}" y1="${zero}" y2="${zero}" stroke="#8ba6c6" stroke-opacity=".35" stroke-dasharray="3 5"/>
    <text x="${W - P.r}" y="${zero - 5}" text-anchor="end" fill="#5f7a9a" font-size="10" font-weight="700">All square</text>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="url(#gl)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="${len}" stroke-dashoffset="${len}">
      <animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </path>
    ${dots}${labels}
  </svg>`;
}

// ---------- router ----------
(async () => {
  try {
    const tab = params.get("tab") || "tonight";
    const slug = params.get("match");
    if (slug) return await renderCard(slug, tab);
    if (tab === "upcoming") return await renderUpcoming();
    if (tab === "results") return await renderResults();
    if (tab === "season") return await renderSeason();
    return await renderTonight();
  } catch (e) {
    app.innerHTML = '<p class="note" style="margin-top:30px">Could not load. Check your connection and refresh.</p>';
    console.error(e);
  }
})();
</script>
