<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pick'em tab icon. A football reads at 16px from its patches, not from seam
       lines: one dark pentagon at the centre and five around it, each half cut off
       by the rim. Clipping to the ball is what gives the cut-off edge patches. -->
  <rect width="32" height="32" rx="7" fill="#07101f"/>
  <circle cx="16" cy="16" r="12.4" fill="#f2f6fc"/>
  <clipPath id="ball"><circle cx="16" cy="16" r="12.4"/></clipPath>
  <g clip-path="url(#ball)" fill="#0b1b30">
    <path d="M16.00 12.70 19.14 14.98 17.94 18.67 14.06 18.67 12.86 14.98Z"/>
    <path d="M24.29 4.59 25.70 8.95 22.00 11.65 18.29 8.95 19.70 4.59Z"/>
    <path d="M27.99 16.00 29.41 20.36 25.70 23.05 21.99 20.36 23.41 16.00Z"/>
    <path d="M18.29 23.04 19.71 27.41 16.00 30.10 12.29 27.41 13.71 23.04Z"/>
    <path d="M8.59 16.00 10.01 20.36 6.30 23.05 2.59 20.36 4.01 16.00Z"/>
    <path d="M12.30 4.59 13.71 8.95 10.00 11.65 6.30 8.95 7.71 4.59Z"/>
  </g>
</svg>
